[project]
name = "science-harness"
version = "0.9.1"
description = "Reusable science harness for controlled benchmark studies of memory and advisory policies"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
readme = "README.md"
[project.optional-dependencies]
dev = ["pytest>=7", "build>=1.2"]
analysis = ["numpy>=1.24", "scipy>=1.9"]
plots = ["matplotlib>=3.7"]
discoverphysics = ["numpy>=1.24", "scipy>=1.9", "jax>=0.4.30"]
physics-comparison = [
    "numpy==2.0.2",
    "scipy==1.13.1",
    "jax==0.4.30",
    "jaxlib==0.4.30",
    "requests>=2.25",
    "tiktoken==0.14.0",
]
newtonbench = [
    "numpy>=1.24",
    "requests>=2.25",
    "openai>=1.68.2",
    "python-dotenv>=0.19",
    "fix-busted-json>=0.0.18",
]
made = [
    "ase>=3.25.0",
    "pymatgen>=2025.6.14",
    "mp-api>=0.45.8",
    "scipy>=1.16.1",
]
[project.scripts]
science-harness = "science_harness.harness.cli:main"
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["science_harness*"]

[tool.setuptools.package-data]
science_harness = ["physics_bridge*.mjs", "providers/*.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires NEWTONBENCH_PATH and optional dependencies"]
