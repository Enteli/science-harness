name: Opt-in NewtonBench integration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev,newtonbench]'
      - run: |
          git clone --filter=blob:none --no-checkout https://github.com/HKUST-KnowComp/NewtonBench.git .cache/NewtonBench
          git -C .cache/NewtonBench checkout 912a4ba5f4356ddd06acc16e44460ca30be4abc2
      - run: python -m pytest -q -m integration tests/test_second_integration.py
        env:
          NEWTONBENCH_PATH: .cache/NewtonBench
