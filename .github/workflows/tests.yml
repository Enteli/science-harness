name: Offline tests and distributions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: python -m pip install -e '.[dev,analysis]'
      - run: python -m pytest -q -m 'not integration'
      - run: python -m build
      - name: Test installed wheel without source imports or optional dependencies
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/wheel-env/bin/python" -I -m science_harness bench list
          "$RUNNER_TEMP/wheel-env/bin/python" -I examples/notebook.py --output "$RUNNER_TEMP/notebook"
