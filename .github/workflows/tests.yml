name: Offline tests and distributions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    name: core (${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.9"
            os: ubuntu-22.04
          - python: "3.12"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: python -m pip install -e '.[dev,analysis]'
      - run: python -m pytest -q -m 'not integration'
      - run: python -m build
      - name: Test installed wheel without source imports or optional dependencies
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/wheel-env/bin/python" -I -m science_harness bench list
          "$RUNNER_TEMP/wheel-env/bin/python" -I examples/notebook.py --output "$RUNNER_TEMP/notebook"
